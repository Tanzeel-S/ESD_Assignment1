global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Assignment 3: each replica is scraped directly (not through Envoy), one
  # target per replica, labelled A/B/C. HTTP and gRPC metrics share one endpoint.
  - job_name: "homeshop-app"
    static_configs:
      - targets: ["homeshop-app-1:8000"]
        labels: { replica: "A" }
      - targets: ["homeshop-app-2:8000"]
        labels: { replica: "B" }
      - targets: ["homeshop-app-3:8000"]
        labels: { replica: "C" }

  - job_name: "envoy"
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["envoy:9901"]

  - job_name: "homeshop-worker"
    static_configs:
      - targets: ["worker:8001"]

  - job_name: "node-exporter"
    static_configs:
      # 'instance' relabeled below to a human-readable machine name,
      # per the assignment's "name the machine being measured" requirement.
      - targets: ["node-exporter:9100"]
        labels:
          instance: "homeshop-dev-host"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
