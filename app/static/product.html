<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — HomeShop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="site-nav"></header>

<main class="page">
  <a href="/shop.html" style="font-size:0.88rem;">← Back to shop</a>
  <div id="content" style="margin-top:1.2rem;">
    <p class="empty-note">Loading…</p>
  </div>
</main>

<script src="/js/common.js"></script>
<script>
  renderNav("shop");

  const params = new URLSearchParams(location.search);
  const productId = params.get("id");

  async function load() {
    if (!productId) {
      document.getElementById("content").innerHTML = `<p class="empty-note">No product specified.</p>`;
      return;
    }
    let product;
    try {
      product = await api(`/products/${productId}`);
    } catch (e) {
      document.getElementById("content").innerHTML = `<p class="empty-note">Product not found.</p>`;
      return;
    }

    document.title = `${product.name} — HomeShop`;
    document.getElementById("content").innerHTML = `
      <div class="panel" style="display:grid; grid-template-columns: 220px 1fr; gap:2rem;">
        <div class="thumb" style="height:220px; font-size:3rem;">${product.name.slice(0,1).toUpperCase()}</div>
        <div>
          <h1 style="font-size:1.6rem;">${product.name}</h1>
          <p style="color:var(--muted); margin:0.6rem 0 1rem;">${product.description || "No description provided."}</p>
          <p style="font-size:0.85rem; color:var(--muted); margin:0 0 0.5rem;">Sold by ${product.seller_id}</p>
          <div class="price" style="font-size:1.4rem; margin-bottom:0.4rem;">${money(product.price_cents)}</div>
          <div class="stock" style="margin-bottom:1.2rem;">${product.stock} in stock</div>
          <div class="qty-control" style="margin-bottom:1rem;">
            <label class="field-label" style="margin:0;">Qty</label>
            <input id="qty" type="number" min="1" value="1" max="${product.stock}">
          </div>
          <button class="primary" ${product.stock < 1 ? "disabled" : ""} onclick="addToCart('${product.id}')">
            ${product.stock < 1 ? "Out of stock" : "Add to cart"}
          </button>
        </div>
      </div>
    `;
  }

  async function addToCart(id) {
    const qty = parseInt(document.getElementById("qty").value, 10) || 1;
    try {
      await api(`/cart/${getUserId()}/add`, {
        method: "POST",
        body: JSON.stringify({ product_id: id, quantity: qty }),
      });
      showToast("Added to cart");
      renderNav("shop");
    } catch (e) {
      showToast(e.message);
    }
  }

  load();
</script>
</body>
</html>
