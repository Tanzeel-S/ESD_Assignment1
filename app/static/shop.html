<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop — HomeShop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="site-nav"></header>

<main class="page">
  <h1 class="page-title">Shop</h1>
  <div class="field-row" style="max-width:320px; margin-bottom:1.5rem;">
    <input id="search" placeholder="Search products…">
  </div>
  <div id="grid" class="product-grid">
    <p class="empty-note">Loading…</p>
  </div>
</main>

<script src="/js/common.js"></script>
<script>
  renderNav("shop");
  let allProducts = [];

  function render(products) {
    const el = document.getElementById("grid");
    if (!products.length) {
      el.innerHTML = `<p class="empty-note">No products match your search.</p>`;
      return;
    }
    el.innerHTML = products.map(p => `
      <div class="product-card">
        <a href="/product.html?id=${p.id}" style="text-decoration:none; color:inherit;">
          <div class="thumb">${p.name.slice(0,1).toUpperCase()}</div>
          <h3>${p.name}</h3>
          <div class="desc">${p.description || ""}</div>
        </a>
        <div class="price">${money(p.price_cents)}</div>
        <div class="desc">Sold by ${p.seller_id}</div>
        <div class="stock">${p.stock} in stock</div>
        <button class="primary" ${p.stock < 1 ? "disabled" : ""} onclick="quickAdd('${p.id}')">
          ${p.stock < 1 ? "Out of stock" : "Add to cart"}
        </button>
      </div>
    `).join("");
  }

  async function quickAdd(productId) {
    try {
      await api(`/cart/${getUserId()}/add`, {
        method: "POST",
        body: JSON.stringify({ product_id: productId, quantity: 1 }),
      });
      showToast("Added to cart");
      renderNav("shop");
    } catch (e) {
      showToast(e.message);
    }
  }

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    render(allProducts.filter(p => p.name.toLowerCase().includes(q)));
  });

  async function load() {
    allProducts = await api("/products");
    render(allProducts);
  }
  load();
</script>
</body>
</html>
